name: Test Pipeline

on:
  push:
    branches: [ test ]
  pull_request:
    branches: [ test ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: devshop_test
          POSTGRES_USER: devshop_user
          POSTGRES_PASSWORD: devshop_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package

    - name: Run integration tests
      run: mvn verify

    - name: Build Docker images
      run: |
        docker build -t devshop/inventory-service:test -f inventory-service/Dockerfile .
        docker build -t devshop/order-service:test -f order-service/Dockerfile .
        docker build -t devshop/api-gateway:test -f api-gateway/Dockerfile .

    - name: Generate test report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-reports
        path: '**/target/surefire-reports/**'

