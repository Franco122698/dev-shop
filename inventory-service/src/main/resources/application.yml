spring:
  application:
    name: inventory-service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:ep-fancy-cake-aoo5cpag.c-2.ap-southeast-1.aws.neon.tech:5432}/${DB_NAME:neondb}?sslmode=require
    username: ${DB_USER:neondb_owner}
    password: ${DB_PASSWORD:npg_D6JoRyB0vikc}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

server:
  port: 8081
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    com.devshop: INFO
    org.springframework.web: DEBUG
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %X{traceId} - %msg%n"

